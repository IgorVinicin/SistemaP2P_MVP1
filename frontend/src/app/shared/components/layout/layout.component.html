<mat-toolbar color="primary" class="app-toolbar">
  <span>Sistema P2P</span>
  <span class="spacer"></span>
  
  <!-- Hamburguer button for Mobile -->
  <button mat-icon-button class="mobile-menu-btn" (click)="toggleMobileMenu()" *ngIf="authService.isAuthenticated()">
    <mat-icon>{{ isMobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
  </button>

  <div *ngIf="authService.isAuthenticated()" class="nav-container" [class.mobile-open]="isMobileMenuOpen">
    <button mat-button routerLink="/dashboard" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() !== 'Administrador' && authService.userRole() !== 'Investidor'">Início</button>
    <button mat-button routerLink="/investor/dashboard" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() === 'Investidor'">Área do Investidor</button>
    <button mat-button routerLink="/score" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() === 'Cliente'">Score</button>
    <button mat-button routerLink="/loans/request" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() === 'Cliente'">Solicitar</button>
    <button mat-button routerLink="/loans/my" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() === 'Cliente'">Meus Empréstimos</button>
    <button mat-button routerLink="/loans/history" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() === 'Cliente'">Histórico</button>
    
    <button mat-button routerLink="/admin" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() === 'Administrador'">Início</button>
    <button mat-button routerLink="/admin/questions" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() === 'Administrador'">Score</button>
    <button mat-button routerLink="/admin/credit" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() === 'Administrador'">Crédito</button>
    <button mat-button routerLink="/admin/loans" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() === 'Administrador'">Empréstimos</button>
    <button mat-button routerLink="/admin/delinquency" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() === 'Administrador'">Fundo/Cobrança</button>
    <button mat-button routerLink="/admin/revenue" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() === 'Administrador'">Receita da Plataforma</button>
    <button mat-button routerLink="/admin/ledger" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() === 'Administrador'">Livro-Razão</button>
    <button mat-button routerLink="/admin/cashflow" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() === 'Administrador'">Fluxo de Caixa</button>
    <button mat-button routerLink="/admin/reports" (click)="isMobileMenuOpen = false" *ngIf="authService.userRole() === 'Administrador'">Relatórios</button>
    
    <button mat-button (click)="logout(); isMobileMenuOpen = false" title="Sair" class="logout-btn">
      <mat-icon style="margin-right: 4px;">exit_to_app</mat-icon> Sair
    </button>
  </div>
</mat-toolbar>

<div class="container">
  <!-- Conectado como (exibido na tela principal) -->
  <div class="user-info-bar" *ngIf="authService.isAuthenticated()" style="display: flex; justify-content: flex-end; font-size: 0.8rem; color: #64748b; margin-bottom: 1.5rem;">
    Conectado como: <strong style="color: #334155; margin-left: 4px;">{{ authService.currentUser()?.email }} ({{ authService.userRole() }})</strong>
  </div>
  <router-outlet></router-outlet>
</div>
