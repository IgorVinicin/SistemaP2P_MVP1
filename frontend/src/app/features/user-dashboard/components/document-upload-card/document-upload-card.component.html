<mat-card class="upload-card">
  <mat-card-header>
    <mat-card-title>{{ label }}</mat-card-title>
  </mat-card-header>

  <mat-card-content class="card-content">
    <div class="status-container">
      <span class="status-label">Status:</span>
      <span class="status-badge" [ngClass]="currentStatus ? currentStatus.toLowerCase() : 'nenhum'">
        {{ currentStatus === 'Pendente' ? 'Em Análise' : (currentStatus || 'Não enviado') }}
      </span>
    </div>

    <div *ngIf="savedPreviewUrl && !selectedFile" class="image-preview-box"><img [src]="savedPreviewUrl" alt="Documento enviado" class="preview-img"></div>
    <a *ngIf="savedFileUrl" [href]="savedFileUrl" target="_blank" rel="noopener">Ver documento enviado</a>
    <p *ngIf="previewError" role="status">{{ previewError }}</p>
    <!-- Preview da Imagem Selecionada -->
    <div *ngIf="previewUrl" class="image-preview-box">
      <img [src]="previewUrl" alt="Prévia do documento" class="preview-img" />
      <div class="preview-overlay">
        <button mat-mini-fab color="warn" type="button" (click)="clearSelection()" title="Remover foto">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>

    <div class="file-picker">
      <input type="file" #fileInput (change)="onFileSelected($event)" (click)="$event.stopPropagation()" accept="image/*,.pdf,application/pdf" style="display: none;">
      
      <button mat-stroked-button type="button" (click)="$event.preventDefault(); $event.stopPropagation(); fileInput.click()" [disabled]="isUploading || currentStatus === 'Aprovado'">
        <mat-icon>photo_camera</mat-icon>
        {{ selectedFile ? 'Substituir Arquivo' : 'Tirar Foto ou Escolher' }}
      </button>

      <span class="file-name" *ngIf="selectedFile && !previewUrl">{{ selectedFile.name }} ({{ formatFileSize(selectedFile.size) }})</span>
      <span class="file-name" *ngIf="selectedFile && previewUrl">{{ formatFileSize(selectedFile.size) }}</span>
    </div>

    <div *ngIf="isUploading" class="uploading-progress">
      <mat-icon class="spinning">autorenew</mat-icon>
      <span>Enviando com segurança...</span>
    </div>
  </mat-card-content>

  <mat-card-actions *ngIf="selectedFile">
    <button mat-flat-button color="primary" type="button" (click)="upload()" [disabled]="isUploading" class="upload-btn">
      <mat-icon>cloud_upload</mat-icon> {{ isUploading ? 'Enviando...' : 'Confirmar e Enviar' }}
    </button>
  </mat-card-actions>
</mat-card>
