<mat-card class="upload-card">
  <mat-card-header>
    <mat-card-title>{{ label }}</mat-card-title>
  </mat-card-header>

  <mat-card-content class="card-content">
    <div class="status-container">
      <span class="status-label">Status:</span>
      <span class="status-badge" [ngClass]="currentStatus ? currentStatus.toLowerCase() : 'nenhum'">
        {{ currentStatus || 'Não enviado' }}
      </span>
    </div>

    <div class="file-picker">
      <input type="file" #fileInput (change)="onFileSelected($event)" accept=".jpg,.jpeg,.png,.pdf" style="display: none;">
      
      <button mat-stroked-button (click)="fileInput.click()" [disabled]="isUploading || currentStatus === 'Aprovado'">
        <mat-icon>attach_file</mat-icon>
        {{ selectedFile ? 'Alterar Arquivo' : 'Selecionar Arquivo' }}
      </button>

      <span class="file-name" *ngIf="selectedFile">{{ selectedFile.name }}</span>
    </div>
  </mat-card-content>

  <mat-card-actions *ngIf="selectedFile">
    <button mat-raised-button color="accent" (click)="upload()" [disabled]="isUploading">
      {{ isUploading ? 'Enviando...' : 'Fazer Upload' }}
    </button>
  </mat-card-actions>
</mat-card>
